<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>

  <h3>Form Pendaftaran</h3>

    <form action="1" method="post" enctype="multipart/form-data">
        <fieldset>
            <legend>Pendaftaran Siswa</legend>

            <p>
                <label for="nama">Nama Lengkap:</label>
                <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap">
            </p>

            <p>
                <label for="nis">NIS:</label>
                <input type="text" id="nis" name="nis" placeholder="Masukkan NIS">
            </p>

            <p>
                <label>Jenis Kelamin:</label>
                <input type="radio" id="laki" name="jk" value="Laki-laki">
                <label for="laki">Laki-laki</label>
                <input type="radio" id="perempuan" name="jk" value="Perempuan">
                <label for="perempuan">Perempuan</label>
            </p>

            <p>
                <label for="tgl_lahir">Tanggal Lahir:</label>
                <input type="date" id="tgl_lahir" name="tgl_lahir">
            </p>

            <p>
                <label for="jurusan">Jurusan:</label>
                <select id="jurusan" name="jurusan">
                    <option value="">--Pilih Jurusan--</option>
                    <option value="rpl">RPL</option>
                    <option value="tkj">TKJ</option>
                    <option value="mm">Multimedia</option>
                </select>
            </p>

            <p>
                <label for="alamat">Alamat:</label><br>
                <textarea id="alamat" name="alamat" rows="4" cols="30" placeholder="Masukkan alamat lengkap"></textarea>
            </p>

            <p>
                <label for="foto">Foto:</label>
                <input type="file" id="foto" name="foto">
            </p>

            <p>
                <input type="checkbox" id="setuju" name="setuju">
                <label for="setuju">Saya menyetujui data yang saya masukkan</label>
            </p>

            <p>
                <button type="submit">Daftar</button>
                <button type="reset">Reset</button>
            </p>
        </fieldset>
    </form>
  
</body>
</html>
